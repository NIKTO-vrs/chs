let myNick='', myRole='ghost', curCh='general', msgCount=0;
let selLoginRole='ghost';

function initLoginRoles(){
  const g=document.getElementById('loginRoleGrid');
  g.innerHTML='';
  Object.entries(ROLES).forEach(([k,r])=>{
    const b=document.createElement('button');
    b.className='rl-btn'+(k===selLoginRole?' sel':'');
    b.style.setProperty('--rc',r.color);
    b.style.setProperty('--rb',r.bg);
    b.textContent=r.label+' — '+({ghost:'تازه‌وارد',noob:'مبتدی',hacker:'هکر',elite:'نخبه',phantom:'ادمین'}[k]);
    b.onclick=()=>{selLoginRole=k;initLoginRoles()};
    g.appendChild(b);
  });
}

let typeLines=['> initializing CHS...','> loading cipher suite...','> awaiting identity...'];
let tli=0,tci=0;

function typeEffect(){
  const el=document.getElementById('typingLine');
  if(!el)return;

  if(tci<typeLines[tli].length){
    el.textContent=typeLines[tli].substring(0,++tci);
    setTimeout(typeEffect,40);
  } else {
    setTimeout(()=>{
      tli=(tli+1)%typeLines.length;
      tci=0;
      typeEffect();
    },1600);
  }
}

function doLogin(){
  const n=document.getElementById('loginNick').value.trim();
  const err=document.getElementById('loginErr');

  if(!n){
    err.textContent='// ERROR: identity required';
    return;
  }

  if(n.length<2){
    err.textContent='// ERROR: min 2 chars';
    return;
  }

  if(BOTS.some(b=>b.nick.toLowerCase()===n.toLowerCase())){
    err.textContent='// ERROR: identity taken';
    return;
  }

  myNick=n;
  myRole=selLoginRole;

  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='flex';

  initApp();
}

function initApp(){
  const r=ROLES[myRole];

  document.getElementById('meTopBadge').innerHTML=
  `<span class="me-badge" style="color:${r.color};border-color:${r.border}">
    ${myNick} [${r.label}]
  </span>`;

  renderUserList();
  renderChatRoles();
  loadCh('general');

  document.getElementById('msgIn').addEventListener('keydown',e=>{
    if(e.key==='Enter')sendMsg();
  });

  startOnlineFlicker();
}

function renderUserList(){
  const ul=document.getElementById('userList');

  ul.innerHTML='';

  const r=ROLES[myRole];

  const me=document.createElement('div');

  me.className='user-item';

  me.innerHTML=
  `<div class="uavatar"
    style="color:${r.color};border-color:${r.border};background:${r.bg}">
    ${myNick.substring(0,2).toUpperCase()}
  </div>

  <div>
    <div class="uname" style="color:${r.color}">
      ${myNick}
    </div>

    <div class="urole" style="color:${r.border}">
      ${r.label}
    </div>
  </div>`;

  ul.appendChild(me);

  BOTS.forEach(b=>{
    const br=ROLES[b.role];

    const d=document.createElement('div');

    d.className='user-item';

    d.innerHTML=
    `<div class="uavatar"
      style="color:${br.color};border-color:${br.border};background:${br.bg}">
      ${b.nick.substring(0,2).toUpperCase()}
    </div>

    <div>
      <div class="uname" style="color:${br.color}">
        ${b.nick}
      </div>

      <div class="urole" style="color:${br.border}">
        ${br.label}
      </div>
    </div>`;

    ul.appendChild(d);
  });

  const total=BOTS.length+1;

  document.getElementById('onlineLabel').textContent=`-- ${total} ONLINE --`;
  document.getElementById('stOnline').textContent=total;
}

function renderChatRoles(){
  const row=document.getElementById('chatRoleRow');

  row.innerHTML='';

  Object.entries(ROLES).forEach(([k,r])=>{
    const b=document.createElement('button');

    b.className='r-btn'+(k===myRole?' sel':'');

    b.style.setProperty('--rc',r.color);
    b.style.setProperty('--rb',r.bg);

    b.textContent=r.label;

    b.onclick=()=>{
      myRole=k;
      renderChatRoles();
      renderUserList();
    };

    row.appendChild(b);
  });
}

function ts(){
  const d=new Date();

  return String(d.getHours()).padStart(2,'0')+':'+
         String(d.getMinutes()).padStart(2,'0');
}

function appendMsg(nick,role,txt,time,sys){
  const box=document.getElementById('messages');

  if(sys){
    const d=document.createElement('div');

    d.className='sys';
    d.textContent=txt;

    box.appendChild(d);
  } else {
    const r=ROLES[role]||ROLES.ghost;

    const d=document.createElement('div');

    d.className='msg';

    d.innerHTML=
    `<div class="msg-av"
      style="color:${r.color};border-color:${r.border};background:${r.bg}">
      ${nick.substring(0,2).toUpperCase()}
    </div>

    <div class="msg-body">
      <div class="msg-hdr">
        <span class="msg-nick" style="color:${r.color}">
          ${nick}
        </span>

        <span class="msg-rbadge" style="color:${r.color}">
          ${r.label}
        </span>

        <span class="msg-ts">
          ${time||ts()}
        </span>
      </div>

      <div class="msg-txt">${txt}</div>
    </div>`;

    box.appendChild(d);

    msgCount++;

    document.getElementById('stMsgs').textContent=msgCount;
  }

  box.scrollTop=box.scrollHeight;
}

function loadCh(ch){
  const box=document.getElementById('messages');

  box.innerHTML='';

  msgCount=0;

  appendMsg('','','-- encrypted channel established --','',true);

  (SEED[ch]||[]).forEach(m=>{
    appendMsg(m.nick,m.role,m.txt,null);
  });

  document.getElementById('stMsgs').textContent=msgCount;
}

function switchCh(ch){
  document.querySelectorAll('.ch-item').forEach(e=>{
    e.classList.remove('active');
  });

  const el=document.getElementById('ch-'+ch);

  if(el)el.classList.add('active');

  curCh=ch;

  document.getElementById('chTitle').textContent=CHS[ch].title;
  document.getElementById('chInfo').textContent=CHS[ch].info;

  loadCh(ch);
}

function sendMsg(){
  const el=document.getElementById('msgIn');

  const txt=el.value.trim();

  if(!txt)return;

  appendMsg(myNick,myRole,txt,ts());

  el.value='';

  setTimeout(()=>{
    const b=BOTS[Math.floor(Math.random()*BOTS.length)];

    const rep=BOT_REPLIES[Math.floor(Math.random()*BOT_REPLIES.length)];

    appendMsg(b.nick,b.role,rep,ts());
  },900+Math.random()*2000);
}

function startOnlineFlicker(){
  setInterval(()=>{
    const base=BOTS.length+1;

    const n=base+Math.floor(Math.random()*3)-1;

    const safe=Math.max(base,n);

    document.getElementById('onlineLabel').textContent=`-- ${safe} ONLINE --`;

    document.getElementById('stOnline').textContent=safe;
  },5000);
}

initLoginRoles();
typeEffect();

document.getElementById('loginNick').addEventListener('keydown',e=>{
  if(e.key==='Enter')doLogin();
});
</script>

<script type="module" src="script.js"></script>
